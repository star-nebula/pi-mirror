<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>Pi-Mirror</title>
  <meta name="description" content="A personal agent grounded in your Markdown notes. Runs as a pi extension." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="/i18n.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-persona" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5.2 19.4c.8-3.4 3.5-5.3 6.8-5.3s6 1.9 6.8 5.3"/></symbol>
    <symbol id="i-ask" viewBox="0 0 24 24"><path d="M4.5 6.5h15v9.2h-8.3L7 19v-3.3H4.5z"/><path d="M9 10.4h.01M12 10.4h.01M15 10.4h.01"/></symbol>
    <symbol id="i-write" viewBox="0 0 24 24"><path d="M4 20l4.2-1 10-10a2.1 2.1 0 0 0-3-3l-10 10z"/><path d="M13.8 7.2l3 3"/></symbol>
    <symbol id="i-guard" viewBox="0 0 24 24"><path d="M12 3.5l7 2.6v5.2c0 4.2-2.8 7.5-7 9.2-4.2-1.7-7-5-7-9.2V6.1z"/><path d="M8.8 12.2l2.1 2.1 4.3-4.4"/></symbol>
    <symbol id="i-timeline" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2"/><path d="M12 7.4V12l3.1 2"/></symbol>
    <symbol id="i-library" viewBox="0 0 24 24"><path d="M4 8.5l8-4 8 4-8 4z"/><path d="M4 12.5l8 4 8-4"/><path d="M4 16.5l8 4 8-4"/></symbol>
    <symbol id="i-consent" viewBox="0 0 24 24"><path d="M4 8h7M15 8h5M4 16h5M13 16h7"/><circle cx="13" cy="8" r="2.2"/><circle cx="11" cy="16" r="2.2"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.2"/><path d="M15.4 15.4L20 20"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2"/><path d="M4 12h16"/><path d="M12 3.8c2.2 2.2 3.3 5 3.3 8.2s-1.1 6-3.3 8.2C9.8 18 8.7 15.2 8.7 12S9.8 6 12 3.8z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19 8.5A7.5 7.5 0 1 0 19.2 15"/><path d="M19 4v4.5h-4.5"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4l-8.5 8.5"/><path d="M18 14v5.5H4.5V6H10"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3.5l1.7 5.1 5.1 1.7-5.1 1.7L12 17.1l-1.7-5.1-5.1-1.7 5.1-1.7z"/><path d="M18.4 15.5l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></symbol>
    <symbol id="i-studio" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2"/><path d="M15.3 8.7l-2 4.6-4.6 2 2-4.6z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5v-3a2 2 0 0 0-2-2h-9a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M6 3.5h8l4 4v13H6z"/><path d="M14 3.5v4h4"/><path d="M9 12h6M9 15.5h6"/></symbol>
  </svg>

  <div class="app">
    <aside class="rail">
      <a class="brand" href="#/" aria-label="Pi-Mirror home">
        <span class="mark" aria-hidden="true"><i></i></span>
        <span class="brand-text"><strong>Pi-Mirror</strong><small>personal agent</small></span>
      </a>

      <nav class="nav" id="nav" aria-label="Workspace"></nav>

      <div class="rail-recent" id="railRecent" hidden>
        <div class="rail-recent-head" id="railRecentHead">最近的运行</div>
        <div class="rail-recent-list" id="railRecentList"></div>
      </div>

      <div class="rail-foot">
        <div class="vault-card">
          <div class="vault-row"><span class="live-dot"></span><span class="vault-name" id="vaultName">vault</span></div>
          <div class="vault-meta" id="vaultMeta">loading…</div>
          <div class="vault-tags" id="vaultTags"></div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="top-actions">
          <button class="ctx-trigger" id="contextTrigger" type="button" aria-label="Open your context">
            <svg><use href="#i-persona"/></svg>
            <span>You</span>
          </button>
          <div class="lang-wrap">
            <button class="ctx-trigger lang-trigger" id="langTrigger" type="button" aria-label="Language" aria-haspopup="true" aria-expanded="false">
              <svg><use href="#i-globe"/></svg>
              <span id="langLabel">中文</span>
            </button>
            <div class="lang-menu" id="langMenu" hidden>
              <button type="button" data-lang="zh"><span>简体中文</span><small>Chinese</small></button>
              <button type="button" data-lang="en"><span>English</span><small>英语</small></button>
            </div>
          </div>
          <button class="search-trigger" id="searchTrigger" type="button" aria-label="Search notes and commands">
            <svg><use href="#i-search"/></svg>
            <span>Search</span>
            <kbd>Ctrl K</kbd>
          </button>
          <span class="model-chip" id="modelChip"></span>
        </div>
      </header>
      <div id="view" class="view"></div>
    </main>
  </div>

  <div class="layer drawer-layer" id="drawerLayer" aria-hidden="true">
    <div class="layer-backdrop" data-close="drawer"></div>
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
      <header class="drawer-head">
        <div>
          <div class="kicker" id="drawerKicker">Detail</div>
          <h2 id="drawerTitle"></h2>
        </div>
        <button class="icon-btn" id="drawerClose" type="button" aria-label="Close">
          <svg><use href="#i-close"/></svg>
        </button>
      </header>
      <div class="drawer-body" id="drawerBody"></div>
    </aside>
  </div>

  <div class="layer palette-layer" id="paletteLayer" aria-hidden="true">
    <div class="layer-backdrop" data-close="palette"></div>
    <div class="palette" role="dialog" aria-modal="true" aria-label="Search and commands">
      <div class="palette-input">
        <svg><use href="#i-search"/></svg>
        <input id="paletteInput" type="text" autocomplete="off" spellcheck="false" placeholder="搜索笔记，或跳转模块…" />
        <kbd>Esc</kbd>
      </div>
      <div class="palette-list" id="paletteList"></div>
      <div class="palette-foot"><span id="paletteHint1">↑ ↓ 选择</span><span id="paletteHint2">↵ 打开</span><span id="paletteHint3">笔记全文只在本机读取</span></div>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
